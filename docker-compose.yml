version: '3.8'

services:
  # App PHP
  app:
    image: php:8.1-fpm-alpine
    container_name: slim_api_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "9000:9000"
    networks:
      - slim_network
    depends_on:
      - db_mysql

  # MySQL Database
  db_mysql:
    image: mysql:8.0
    container_name: slim_api_mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-api_db}
      MYSQL_USER: ${DB_USER:-api_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-api_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - slim_network

  # PostgreSQL Database (opcional)
  db_pgql:
    image: postgres:15-alpine
    container_name: slim_api_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-api_db}
      POSTGRES_USER: ${DB_USER:-api_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-api_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - slim_network
    profiles: ["postgres"]

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: slim_api_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - slim_network

volumes:
  mysql_data:
  postgres_data:

networks:
  slim_network:
    driver: bridge
